<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E3A5F">
<title>매일 언어 — 중국어 · 영어</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css?v=202608222203">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="langtabs" id="langtabs">
      <button class="langtab" data-lang="zh"><span class="flag">中</span>중국어</button>
      <button class="langtab" data-lang="en"><span class="flag">EN</span>영어</button>
    </div>
    <button class="iconbtn" id="btn-menu" title="설정·진도">☰</button>
  </div>
  <div class="daybar">
    <button class="daynav" id="day-prev" title="이전 회차">‹</button>
    <div class="dayinfo">
      <div class="dayline"><strong id="day-n">Day 1</strong><span id="day-total">/ 55</span>
        <span class="pill" id="day-dday"></span></div>
      <div class="daytheme"><span id="day-phase"></span> · <span id="day-theme"></span></div>
    </div>
    <button class="daynav" id="day-next" title="다음 회차">›</button>
  </div>
  <div class="progress"><div class="progress-in" id="progress-in"></div></div>
</header>

<nav class="steps" id="steps">
  <button data-step="brief">① 브리핑</button>
  <button data-step="learn">② 학습</button>
  <button data-step="say">③ 발음</button>
  <button data-step="talk">④ 대화</button>
  <button data-step="review">⑤ 복습</button>
  <button data-step="done">⑥ 미션</button>
</nav>

<main id="main">
  <!-- ① 브리핑 -->
  <section class="step" data-step="brief">
    <h2>오늘의 브리핑</h2>
    <div class="card brief">
      <div class="brief-head"><span id="b-phase" class="tag"></span><span id="b-dday" class="tag alt"></span></div>
      <h3 id="b-theme"></h3>
      <p id="b-tip" class="tip"></p>
      <div id="b-accent" class="accentbox hidden">
        <h4>보스턴 발음 포인트</h4>
        <p id="b-accent-body"></p>
      </div>
      <div class="plan">
        <span>학습 5문장</span><span>발음 테스트</span><span>대화 1편</span><span>복습 4문장</span>
        <b>약 30분</b>
      </div>
    </div>
    <button class="go" data-goto="learn">학습 시작 →</button>
  </section>

  <!-- ② 학습 -->
  <section class="step" data-step="learn">
    <h2>오늘의 5문장</h2>
    <div id="learn-list" class="list"></div>
    <button class="go" data-goto="say">발음 테스트로 →</button>
  </section>

  <!-- ③ 발음 -->
  <section class="step" data-step="say">
    <h2>발음 테스트</h2>
    <p class="hint" id="say-hint">문장을 듣고, 마이크 버튼을 누른 뒤 소리 내어 따라 말하십시오.</p>
    <div id="say-list" class="list"></div>
    <div class="scorebox" id="say-score"></div>
    <button class="go" data-goto="talk">대화 연습으로 →</button>
  </section>

  <!-- ④ 대화 -->
  <section class="step" data-step="talk">
    <h2>대화 연습</h2>
    <div class="card talkhead">
      <h3 id="talk-title"></h3>
      <p id="talk-scene" class="tip"></p>
    </div>
    <div id="talk-log" class="talklog"></div>
    <div class="talkctl">
      <button id="talk-start" class="primary">대화 시작</button>
      <button id="talk-reset" class="ghost">처음부터</button>
    </div>
    <button class="go" data-goto="review">복습으로 →</button>
  </section>

  <!-- ⑤ 복습 -->
  <section class="step" data-step="review">
    <h2>복습 <span class="sub">간격반복</span></h2>
    <p class="hint">예전에 배운 문장입니다. 뜻을 먼저 떠올리고 카드를 누르십시오.</p>
    <div id="review-list" class="list"></div>
    <button class="go" data-goto="done">마무리 →</button>
  </section>

  <!-- ⑥ 미션 -->
  <section class="step" data-step="done">
    <h2>오늘의 미션</h2>
    <div class="card">
      <label class="mission"><input type="checkbox" id="mission-chk"><span id="mission-txt"></span></label>
    </div>
    <div class="card summary" id="done-summary"></div>
    <button class="go primary" id="btn-complete">오늘 학습 완료</button>
  </section>
</main>

<!-- 설정 패널 -->
<div class="sheet hidden" id="sheet">
  <div class="sheet-in">
    <h3>진도 · 설정</h3>
    <div class="statgrid" id="statgrid"></div>
    <h4>회차 이동</h4>
    <div class="calendar" id="calendar"></div>
    <h4>기기 간 진도 옮기기</h4>
    <p class="hint">진도는 이 브라우저에만 저장됩니다. 휴대폰↔PC를 맞추려면 내보내고 불러오십시오.</p>
    <div class="row">
      <button id="btn-export" class="ghost">진도 내보내기</button>
      <button id="btn-import" class="ghost">진도 불러오기</button>
    </div>
    <textarea id="io-box" class="hidden" spellcheck="false"></textarea>
    <h4>말하기 속도</h4>
    <input type="range" id="rate" min="0.5" max="1.1" step="0.05" value="0.8">
    <div class="row"><span id="rate-val" class="hint"></span></div>
    <button id="sheet-close" class="primary wide">닫기</button>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="js/store.js?v=202608222203"></script>
<script src="js/speech.js?v=202608222203"></script>
<script src="js/review.js?v=202608222203"></script>
<script src="js/app.js?v=202608222203"></script>
</body>
</html>
